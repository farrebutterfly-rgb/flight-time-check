name: tests
on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install pytest mcp
      - run: python -m pytest -q
      - run: python sql/run.py
      - run: python canary.py
      - run: python stats.py

  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci && npm test
        working-directory: ts
      - run: npm ci && npm run build
        working-directory: app
      - uses: actions/upload-artifact@v4
        with:
          name: flight-time-check-app
          path: app/dist/index.html

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - run: go vet ./... && go test ./...
        working-directory: go
      - run: go build -o ftcheck ./ftcheck && ./ftcheck -guard ../examples/quoted_all.json > /dev/null
        working-directory: go
